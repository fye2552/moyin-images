satisfying_hooks:
  - hook_id: "satisfying_001"
    result_type: "neat_dual_device_charging"
    opening_scene: "Close-up of the adapter upright in one hotel wall outlet while a phone and earbud case show credible charging indicators through two neat cables."
    satisfying_detail: "The front interface stays visible and the bedside table looks clean and uncluttered."
    visual_trigger: "one outlet, two devices, two clean cable lines"
    product_relevance: "two USB-A and two USB-C ports support a compact charging setup"
    dedupe_key: "hotel_bedside|dual_device_result|front_low_angle|two_cables"
  - hook_id: "satisfying_002"
    result_type: "clutter_to_clean_charging"
    opening_scene: "Top-front close-up of a tidy hotel charging setup with the same adapter centered, phone and earbud case charging, and unused ports clearly visible."
    satisfying_detail: "A quick rack focus moves from both charging indicators to the adapter's exact four-port face."
    visual_trigger: "tidy surface and visible spare ports"
    product_relevance: "compact all-in-one travel adapter reduces separate charger clutter"
    dedupe_key: "hotel_bedside|tidy_result|top_front_focus|spare_ports"
