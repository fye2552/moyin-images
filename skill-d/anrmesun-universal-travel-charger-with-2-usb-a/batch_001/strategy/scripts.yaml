scripts:
  - script_id: "script_d_001"
    duration: 10
    style: "satisfying_result_hook"
    timeline:
      - time: "0-3s"
        purpose: "satisfying result hook"
        scene: "Open on the finished hotel bedside setup: one upright adapter, two neat cables, phone and earbud case both charging."
      - time: "3-6s"
        purpose: "pain amplification"
        scene: "Flash back to the single outlet and one small charger; the traveler swaps cables between two low-battery devices."
      - time: "6-10s"
        purpose: "product solution"
        scene: "Insert the exact adapter, connect phone and earbud case, then return to the clean front-facing charging result."
    cta: "One outlet. A cleaner charging setup."
    dedupe_key: "hotel|dual_charge_hook|cable_swap_pain|front_solution"
  - script_id: "script_d_002"
